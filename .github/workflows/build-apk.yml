name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Use runner Android SDK
        run: |
          mkdir -p MovFlix/app/src/main/java/com/movflix/app MovFlix/app/src/main/res/layout MovFlix/app/src/main/res/menu MovFlix/app/src/main/res/color MovFlix/app/src/main/res/drawable
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          SM=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | $SM --licenses > /dev/null
          $SM "platforms;android-34" "build-tools;34.0.0"

      - name: Write app files (UI v3)
        run: |
          mkdir -p MovFlix/app/src/main/java/com/movflix/app MovFlix/app/src/main/res/layout MovFlix/app/src/main/res/menu MovFlix/app/src/main/res/color MovFlix/app/src/main/res/drawable
          echo "" | base64 -d > MovFlix/app/src/main/AndroidManifest.xml
          echo "" | base64 -d > MovFlix/app/src/main/java/com/movflix/app/Adapters.kt
          echo "" | base64 -d > MovFlix/app/src/main/java/com/movflix/app/Api.kt
          echo "" | base64 -d > MovFlix/app/src/main/java/com/movflix/app/BaseActivity.kt
          echo "" | base64 -d > MovFlix/app/src/main/java/com/movflix/app/CrashActivity.kt
          echo "" | base64 -d > MovFlix/app/src/main/java/com/movflix/app/DetailActivity.kt
          echo "" | base64 -d > MovFlix/app/src/main/java/com/movflix/app/HomeFragment.kt
          echo "" | base64 -d > MovFlix/app/src/main/java/com/movflix/app/MainActivity.kt
          echo "" | base64 -d > MovFlix/app/src/main/java/com/movflix/app/MediaListFragment.kt
          echo "" | base64 -d > MovFlix/app/src/main/java/com/movflix/app/MyApp.kt
          echo "" | base64 -d > MovFlix/app/src/main/java/com/movflix/app/ProfileFragment.kt
          echo "" | base64 -d > MovFlix/app/src/main/java/com/movflix/app/ProviderFragment.kt
          echo "" | base64 -d > MovFlix/app/src/main/java/com/movflix/app/SearchFragment.kt
          echo "" | base64 -d > MovFlix/app/src/main/java/com/movflix/app/SplashActivity.kt
          echo "" | base64 -d > MovFlix/app/src/main/res/color/bottom_nav_color.xml
          echo "" | base64 -d > MovFlix/app/src/main/res/drawable/banner_gradient.xml
          echo "PD94bWwgdmVyc2lvbj0iMS4wIiBlbmNvZGluZz0idXRmLTgiPz4KPHNoYXBlIHhtbG5zOmFuZHJvaWQ9Imh0dHA6Ly9zY2hlbWFzLmFuZHJvaWQuY29tL2Fway9yZXMvYW5kcm9pZCIKICAgIGFuZHJvaWQ6c2hhcGU9Im92YWwiPgogICAgPHNvbGlkIGFuZHJvaWQ6Y29sb3I9IkBjb2xvci9hY2NlbnQiIC8+Cjwvc2hhcGU+Cg==" | base64 -d > MovFlix/app/src/main/res/drawable/circle_bg.xml
          echo "" | base64 -d > MovFlix/app/src/main/res/layout/activity_detail.xml
          echo "" | base64 -d > MovFlix/app/src/main/res/layout/activity_main.xml
          echo "" | base64 -d > MovFlix/app/src/main/res/layout/activity_splash.xml
          echo "" | base64 -d > MovFlix/app/src/main/res/layout/fragment_home.xml
          echo "" | base64 -d > MovFlix/app/src/main/res/layout/fragment_list.xml
          echo "" | base64 -d > MovFlix/app/src/main/res/layout/fragment_profile.xml
          echo "" | base64 -d > MovFlix/app/src/main/res/layout/fragment_provider.xml
          echo "" | base64 -d > MovFlix/app/src/main/res/layout/fragment_search.xml
          echo "" | base64 -d > MovFlix/app/src/main/res/layout/item_banner.xml
          echo "" | base64 -d > MovFlix/app/src/main/res/layout/item_cast.xml
          echo "" | base64 -d > MovFlix/app/src/main/res/layout/item_media.xml
          echo "" | base64 -d > MovFlix/app/src/main/res/layout/item_provider.xml
          echo "" | base64 -d > MovFlix/app/src/main/res/menu/bottom_nav_menu.xml
          echo "" | base64 -d > MovFlix/app/src/main/res/values/colors.xml
          echo "" | base64 -d > MovFlix/app/src/main/res/values/themes.xml
          echo "" | base64 -d > MovFlix/app/src/main/res/drawable/ic_nav_home.png
          echo "" | base64 -d > MovFlix/app/src/main/res/drawable/ic_nav_shows.png
          echo "" | base64 -d > MovFlix/app/src/main/res/drawable/ic_nav_movies.png
          echo "" | base64 -d > MovFlix/app/src/main/res/drawable/ic_nav_anime.png
          echo "" | base64 -d > MovFlix/app/src/main/res/drawable/ic_nav_search.png
          echo "" | base64 -d > MovFlix/app/src/main/res/drawable/ic_profile.png
          echo "" | base64 -d > MovFlix/app/src/main/res/drawable/ic_back.png
          sed -i 's|YOUR-BACKEND|movflix-16ow|' MovFlix/app/build.gradle.kts

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        run: |
          cd MovFlix
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: movflix-apk
          path: MovFlix/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
