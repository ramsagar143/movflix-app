name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Use runner Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          SM=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | $SM --licenses > /dev/null
          $SM "platforms;android-34" "build-tools;34.0.0"

      - name: Add crash catcher + backend URL
        run: |
          cd MovFlix
          echo "" | base64 -d > app/src/main/java/com/movflix/app/MyApp.kt
          echo "" | base64 -d > app/src/main/java/com/movflix/app/CrashActivity.kt
          sed -i 's|<application|<application android:name=".MyApp"|' app/src/main/AndroidManifest.xml
          sed -i 's|</application>|<activity android:name=".CrashActivity" android:exported="false" /></application>|' app/src/main/AndroidManifest.xml
          sed -i 's|YOUR-BACKEND|movflix-16ow|' app/build.gradle.kts

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        run: |
          cd MovFlix
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: movflix-apk
          path: MovFlix/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
